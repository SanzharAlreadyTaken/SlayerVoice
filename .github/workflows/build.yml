name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f SlayerVoice.zip ]; then unzip -o -q SlayerVoice.zip; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "Не найден settings.gradle.kts"
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find . -path "*/outputs/apk/release/*.apk" -exec cp {} out/SlayerVoice.apk \;
          ls -l out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Slayer Voice (сборка ${{ github.run_number }})
          files: out/SlayerVoice.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: SlayerVoice-apk
          path: out/SlayerVoice.apk
